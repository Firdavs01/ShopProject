<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>


     <div class="sidebar-overlay"></div>

    <aside>
      <div class="sidebar__header">
        <h2 >Cart List <span id="cartQuantity" >0</span></h2>

        <button class="close__btn"></button>
      </div>

      <div class="sidebar__list" id="sidebar__list"></div>

      <div class="sidebar__footer">
        <p id="totalPrices">Total: 0</p>
        <button>Checkout</button>
        <button id="clearBasket">clear all</button>
      </div>
    </aside>


    <header class="header">
      <div class="container">
        <div class="nav">
          <h1 class="nav__title">ShopJS</h1>

          <ul class="nav__list">
            <li><a href="#" class="nav__link">link</a></li>
            <li><a href="#" class="nav__link">v</a></li>
            <li><a href="#" class="nav__link">avokando</a></li>
          </ul>
          
          <input type="text" placeholder="search" id="search">

          <label>Select a category</label>
          <select id="category">
            <option value="all">All Categories</option>
            <option value="electronics">Electronics</option>
            <option value="jewelry">Jewelry</option>
            <option value="men's clothing">Men's Clothing</option>
            <option value="women's clothing">Women's Clothing</option>
          </select>

          <label>Sort by price</label>
          <select id="sort">
            <option value="default">Default</option>
            <option value="asc">Low to High</option>
            <option value="desc">High to Low</option>
          </select>
          <div class="menuS menu">click</div>
        </div>
      </div>
    </header>
    <main class="main">
      <div class="container">
        <div class="main__list" id="mainList"></div>
      </div>
    </main>

    <footer class="footer">
      <h1>asdfasdfasf</h1>
    </footer>

    <script src="js/main.js" type="module"></script>
  </body>
</html>
